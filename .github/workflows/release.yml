name: Build and release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Hand-set semantic version (bump for meaningful milestones — e.g. this desktop app launch),
  # shown as the release title. Deliberately decoupled from the release TAG, which stays
  # "v<github.run_number>": that's what both apps' in-app update checks compare as a plain
  # integer, and changing it would break the already-shipped Android app's update detection for
  # anyone with an older version installed. Shared at workflow level so both jobs below use the
  # exact same title instead of two copies that can drift apart.
  APP_VERSION_NAME: "1.9.0"

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Rename APK for release
        # A version-qualified filename (instead of always the same "HEStundenplan.apk") means the
        # browser sees a genuinely new file name on every release and just saves it — it only
        # started appending "(1)", "(2)", ... on repeat downloads because every past release
        # reused that identical name, and Chrome won't overwrite an existing download by default.
        run: cp app/build/outputs/apk/release/app-release.apk "HEStundenplan-${{ env.APP_VERSION_NAME }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "${{ env.APP_VERSION_NAME }}"
          body_path: RELEASE_NOTES.md
          files: HEStundenplan-${{ env.APP_VERSION_NAME }}.apk

  build-desktop:
    # Runs after build-android so both jobs upload to the same v<run number> release without
    # racing to create it first.
    needs: build-android
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja extra-cmake-modules git \
            qt6-base qt6-declarative qt6-svg \
            kirigami kconfig kcoreaddons ki18n knotifications kdbusaddons \
            libxml2

      - uses: actions/checkout@v4
        with:
          # Full history so the PKGBUILD's pkgver() (git rev-list --count HEAD) is meaningful —
          # actions/checkout's default shallow clone (depth 1) would make every build "pkgver=1".
          fetch-depth: 0

      - name: Build and package (pacman package)
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
        run: |
          # chown'ing the checkout below for the unprivileged makepkg build makes git (run as
          # root again in the next step) refuse to touch it as "dubious ownership" — trust it
          # globally for root up front so later git commands in this job still work.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cp desktop/packaging/PKGBUILD /tmp/PKGBUILD
          sed -i 's|source=("git+${url}.git")|source=()|' /tmp/PKGBUILD
          sed -i '/^sha256sums=/d' /tmp/PKGBUILD
          sed -i "s|cd \"\${srcdir}/HEStundenplanApp\"|cd \"$GITHUB_WORKSPACE\"|" /tmp/PKGBUILD
          sed -i "s|\${srcdir}/HEStundenplanApp/desktop|$GITHUB_WORKSPACE/desktop|" /tmp/PKGBUILD
          mkdir -p /tmp/build && chown builder:builder /tmp/build /tmp/PKGBUILD
          su builder -c "cd /tmp/build && cp /tmp/PKGBUILD . && APP_VERSION_CODE=${APP_VERSION_CODE} APP_VERSION_NAME=${APP_VERSION_NAME} makepkg -f --skippgpcheck --nocheck"
          cp /tmp/build/*.pkg.tar.zst "$GITHUB_WORKSPACE/hestundenplan-desktop-${{ github.run_number }}-x86_64.pkg.tar.zst"

      - name: Create source tarball (build-from-source path)
        run: |
          git archive --format=tar.gz --prefix=HEStundenplanApp-desktop/ -o "hestundenplan-desktop-${{ github.run_number }}-src.tar.gz" HEAD -- desktop CMakeLists.txt 2>/dev/null || \
          git archive --format=tar.gz --prefix=HEStundenplanApp-desktop/ -o "hestundenplan-desktop-${{ github.run_number }}-src.tar.gz" HEAD -- desktop

      - name: Upload desktop artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          # No `name:` here — this call only adds files/body to the release build-android already
          # created with the real title. Setting it again (previously to the bare run number, a
          # regression) would clobber that title.
          append_body: true
          body: |

            ---
            **Linux/KDE Plasma Desktop-App** — drei Wege zur Installation:
            1. **Arch/CachyOS-Paket** (empfohlen für CachyOS): `hestundenplan-desktop-*.pkg.tar.zst` herunterladen, dann `sudo pacman -U hestundenplan-desktop-*.pkg.tar.zst`
            2. **AUR/PKGBUILD selbst bauen**: `desktop/packaging/PKGBUILD` aus dem Quellcode verwenden (`makepkg -si`)
            3. **Aus dem Quellcode bauen** (jede Distro mit Qt6/KDE Frameworks 6): Quell-Tarball entpacken, dann `cmake -S desktop -B build && cmake --build build && sudo cmake --install build`
          files: |
            hestundenplan-desktop-${{ github.run_number }}-x86_64.pkg.tar.zst
            hestundenplan-desktop-${{ github.run_number }}-src.tar.gz
