name: Build and release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      # versionName is a hand-set semantic version (bumped manually here for meaningful
      # milestones), deliberately decoupled from versionCode — the latter must stay tied to
      # github.run_number since it's what the in-app update check compares as a plain integer
      # against the release tag ("v<run number>").
      APP_VERSION_NAME: "1.6.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Rename APK for release
        # A version-qualified filename (instead of always the same "HEStundenplan.apk") means the
        # browser sees a genuinely new file name on every release and just saves it — it only
        # started appending "(1)", "(2)", ... on repeat downloads because every past release
        # reused that identical name, and Chrome won't overwrite an existing download by default.
        run: cp app/build/outputs/apk/release/app-release.apk "HEStundenplan-${{ env.APP_VERSION_NAME }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "${{ env.APP_VERSION_NAME }}"
          body_path: RELEASE_NOTES.md
          files: HEStundenplan-${{ env.APP_VERSION_NAME }}.apk
